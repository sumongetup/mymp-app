<!doctype html>
<!-- Play Store feature graphic, 1024x500. Rendered to feature-graphic.png with
     headless Chrome; see docs/play-store.md. -->
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: NSB; src: url(../assets/fonts/NotoSansBengali-Bold.ttf); font-weight: 700; }
  @font-face { font-family: NSB; src: url(../assets/fonts/NotoSansBengali-Medium.ttf); font-weight: 500; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: NSB, sans-serif;
    background: linear-gradient(120deg, #0f6a4b 0%, #0b5139 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box;
    color: #fff;
  }
  .mark {
    flex: none; width: 260px; height: 260px; border-radius: 56px; background: #fff;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
    display: grid; place-items: center; overflow: hidden;
  }
  .mark img { width: 260px; height: 260px; transform: scale(1.3); }
  h1 { font-size: 84px; font-weight: 700; margin: 0 0 6px; line-height: 1.2; }
  p { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.45; opacity: .95; }
  .tags { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tags span {
    font-size: 22px; font-weight: 500; padding: 6px 16px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
  }
</style>
</head>
<body>
  <div class="mark"><img src="../assets/images/mark.png" alt=""></div>
  <div>
    <h1>আমার এমপি</h1>
    <p>আপনার আসনের সংসদ সদস্য,<br>এক নজরে সব তথ্য</p>
    <div class="tags"><span>সংসদ সদস্য</span><span>মন্ত্রিসভা</span><span>নির্বাচনী ফল</span><span>সংবাদ</span></div>
  </div>
</body>
</html>
